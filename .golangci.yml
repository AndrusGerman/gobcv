# Configuración de golangci-lint v2 para BCV Currency API
# Creado por AndrusCodex

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - goimports
    - misspell
    - bodyclose
    - goconst
    - gosec
    - revive
    - lll

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
  lll:
    line-length: 120
  misspell:
    locale: US
  revive:
    confidence: 0
