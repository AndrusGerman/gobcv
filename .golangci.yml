# Configuración de golangci-lint v2 para BCV Currency API
# Creado por AndrusCodex

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  # none = disable all by default, then enable specific ones
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - misspell
    - gosec
    - revive
  
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    misspell:
      locale: US
    revive:
      confidence: 0
