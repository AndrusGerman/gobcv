# Configuración de golangci-lint v2 para BCV Currency API
# Creado por AndrusCodex

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  # none = disable all by default, then enable specific ones
  default: none
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - goimports
    - misspell
    - bodyclose
    - goconst
    - gosec
    - revive
    - lll
  
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    lll:
      line-length: 120
    misspell:
      locale: US
    revive:
      confidence: 0
